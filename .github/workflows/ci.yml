name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"  # 3.14 used locally; pin latest stable on runners
      - run: pip install -r requirements.txt
      - run: pip install -e .
      - run: python -m pytest
        env:
          # Deterministic fallbacks only — no API keys in CI, by design
          PYTHONHASHSEED: "0"
