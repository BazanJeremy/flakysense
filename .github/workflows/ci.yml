name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: no job here writes to the repository. A job that needs
# more declares it itself.
permissions:
  contents: read

jobs:
  # requires-python is >=3.12: the declared floor is tested, not assumed.
  # A separate job, so the required check `test` keeps its name.
  test-py312:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: pip install -e .
      - run: python -m pytest
        env:
          PYTHONHASHSEED: "0"

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"  # 3.14 used locally; pin latest stable on runners
      - run: pip install -r requirements.txt
      - run: pip install -e .
      - run: python -m pytest
        env:
          # Deterministic fallbacks only — no API keys in CI, by design
          PYTHONHASHSEED: "0"
