[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flakysense"
version = "0.1.0"
description = "Flaky test intelligence agent"
requires-python = ">=3.12"

[project.optional-dependencies]
# System 2 enhancement layer (ADR-004) — never required by tests or CI.
llm = ["anthropic>=0.40"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
